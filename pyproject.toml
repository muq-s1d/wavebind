[project]
name = "wavebind"
version = "0.1.0"
description = "Bind webcam hand gestures to desktop actions. Offline, Wayland-native."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mediapipe>=1.0", "jeepney"]

[project.scripts]
wavebind = "wavebind.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wavebind"]
