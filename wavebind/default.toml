# wavebind config. Copy to ~/.config/wavebind/config.toml to customize.
#
# Each binding is exactly one of:
#   cmd   = "a command"      run directly, no shell
#   media = "PlayPause"      PlayPause, Next, Previous or Stop on the active media player
#   keys  = "super+Page_Down" press a key combo (X keysym names; super/ctrl/alt/shift aliases)
# plus optionally:
#   repeat = 0.3             keep firing every 0.3 s while the gesture is held
#
# Only `keys` bindings need key-press permission. On GNOME/KDE that is the
# xdg-desktop-portal RemoteDesktop dialog, asked the first time a `keys` binding fires.

# true:  allow once, remembered (token saved to ~/.local/share/wavebind/portal_token, mode 0600).
#        Delete that file to be asked again.
# false: ask for key-press permission every launch, store nothing.
remember_key_permission = true

# Frames analyzed per second with a hand in view, and with none (idle).
# Lower = less CPU, slower reactions.
fps = 15
idle_fps = 5

# Arming: hold arm_gesture for arm_hold s. While armed you can chain gestures; it disarms after
# armed_for s without one. A gesture must be seen stable_frames frames in a row. After a gesture,
# cooldown s of nothing (swipe_cooldown after a swipe). Holding a gesture fires it only once.
[engine]
arm_gesture = "Open_Palm"
arm_hold = 0.5
armed_for = 3.0
cooldown = 0.5
swipe_cooldown = 1.0
stable_frames = 3

# Swipe while armed: wrist moves `distance` (fraction of frame width or height) within `window` s,
# and the hand is still in view confirm_frames frames later (so dropping your hand isn't a swipe down).
[swipe]
distance = 0.25
window = 0.4
confirm_frames = 2

# Pinch to drag a window: arm, pinch thumb + index, move your hand, open to drop. Holds `modifier` +
# left mouse button, which on GNOME drags the window under the mouse pointer.
# Needs mouse-pointer permission (asked once). Delete this section to disable it and stay keyboard-only.
[pinch]
modifier = "super"
on = 0.3       # pinch closes below this thumb-to-index distance (fraction of palm size)
off = 0.45     # and opens above this
gain = 1500    # pointer pixels per full frame width of hand movement
smooth = 0.5   # 0..1: lower = steadier but laggier

[bindings]
# Like a phone: swipe left to go to the workspace on the right.
swipe_left = { keys = "super+Page_Down" }    # GNOME: next workspace
swipe_right = { keys = "super+Page_Up" }     # GNOME: previous workspace
swipe_up = { keys = "super" }                # GNOME: Activities overview
swipe_down = { keys = "super+h" }            # GNOME: minimize window
Pointing_Up = { keys = "alt+F10" }           # GNOME: maximize / restore
Victory = { keys = "Print" }                 # GNOME: screenshot tool
ILoveYou = { keys = "super+d" }              # GNOME: show desktop
Closed_Fist = { media = "PlayPause" }
# Volume keys, so the desktop shows its volume popup and handles mute. Hold to keep going.
# Without key permission instead: { cmd = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+", repeat = 0.3 }
Thumb_Up = { keys = "XF86AudioRaiseVolume", repeat = 0.3 }
Thumb_Down = { keys = "XF86AudioLowerVolume", repeat = 0.3 }
